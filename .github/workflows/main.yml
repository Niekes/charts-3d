name: CI

on:
  - pull_request
  - push

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck

  template:
    name: Registry Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Fallow resolves the template rules against the changed
          # files, so the history has to be there.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: Check the registry template
        run: npm run lint
        env:
          # Report the findings as inline annotations on the pull
          # request instead of a wall of text in the log.
          FALLOW_FORMAT: github-annotations

  test:
    name: Test (Node ${{matrix.node}})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{matrix.node}}
          cache: "npm"
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test, template]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      # Typecheck, the registry JSON and the prerendered docs.
      - run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/client/
      # Both badges in one commit, so no second push races the first.
      - name: Update the coverage and fallow health badges
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          npm run coverage
          npm run coverage:badge
          npx fallow health --format badge > .github/badges/health.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json .github/badges/health.svg
          git diff --quiet --cached || git commit -m "chore: update the badges [skip ci]"
          git push
