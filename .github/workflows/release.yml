name: Release

# A release ships twice from one version: the npm package `@niekes/charts-3d`
# and the shadcn registry, installed from the repository.
#
# The registry is a tag that `npx shadcn add niekes/charts-3d/<item>#v<version>`
# can pin. The shadcn CLI does not pass the tag on to the registry
# dependencies, so the tag sits on a release commit beside `master` that pins
# the core to it too.
on:
  push:
    branches: [master]
    paths:
      - package.json
  # Retries a release whose publish failed.
  workflow_dispatch:

jobs:
  publish:
    name: Stage on npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # npm stage publish needs the npm that ships with Node 24.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Check whether the version is new
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@niekes/charts-3d@$VERSION" version >/dev/null 2>&1; then
              echo "new=false" >> "$GITHUB_OUTPUT"
              echo "@niekes/charts-3d@$VERSION is already on npm, skipping the publish."
          else
              echo "new=true" >> "$GITHUB_OUTPUT"
              echo "Publishing @niekes/charts-3d@$VERSION."
          fi
      - name: Read the release notes
        # Before anything is staged: a version without its section in
        # CHANGELOG.md stops here, not after its publish waits on npm.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { f = 1; next } /^## \[/ { f = 0 } f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
              echo "CHANGELOG.md has no section '## [$VERSION]' to release with."
              exit 1
          fi
      - name: Stage the publish
        if: steps.version.outputs.new == 'true'
        # Trusted publishing: OIDC instead of a token, provenance included.
        # The version goes live once a maintainer approves it with 2FA.
        # npm stage publish runs prepack, which typechecks and builds dist/.
        run: npm stage publish
      - name: Release on GitHub
        # Runs for a version that is on npm already as well, so a rerun adds a
        # missing release, with the notes read above.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "v$VERSION is released on GitHub already."
              exit 0
          fi
          # A rerun after the tag went out releases that tag instead of making another.
          if ! git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null; then
              # Pin every dependency on this registry to the release, and check the pin.
              sed -i "s|\"niekes/charts-3d/\([a-z0-9-]*\)\"|\"niekes/charts-3d/\1#v$VERSION\"|g" registry.json
              npm run lint:template
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              # The release commit stays off `master`: only its tag is pushed.
              git checkout --detach
              git commit -am "🔖 chore(release): $VERSION"
              git tag "v$VERSION"
              git push origin "v$VERSION"
          fi
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
