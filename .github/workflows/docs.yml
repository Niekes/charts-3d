name: Docs

# The release workflow runs this on the tag of every release, so the docs
# show the API that is on npm and install the release. Run it by hand on a
# tag, never on `main`: the github-pages environment has to allow `v*` tags.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The docs show the API of their release: until a maintainer approves
      # the staged version, npm installs the one before. Re-run once it is out.
      - name: Wait for the release on npm
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "Run the docs on a release tag, not on $GITHUB_REF_NAME."; exit 1; }
          npm view "@niekes/charts-3d@${GITHUB_REF_NAME#v}" version
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The registry JSON first: the docs build copies it to /r/.
      - run: npm run registry:build
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
